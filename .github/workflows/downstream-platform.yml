# Platform pins this repository at a commit and verifies the installed package
# with its own contract tests. Running those tests here, against the change
# under review, makes a Core change that would break Platform red before it
# merges rather than at the next pin bump.
name: downstream platform

on:
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The secret is read here only; the steps that build and import the
      # reviewed code run with no credential in their environment.
      - name: gate on the Platform read token
        id: gate
        env:
          TOKEN: ${{ secrets.PLATFORM_READ_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice ::PLATFORM_READ_TOKEN is not set; the downstream contract check did not run"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.run == 'true'
        with:
          repository: TBI-AI-Incubator/codify-platform
          ref: main
          token: ${{ secrets.PLATFORM_READ_TOKEN }}
          persist-credentials: false
      # The reviewed revision is fetched by a trusted step and served to uv from
      # a local bare mirror, so the resolver needs no credential at all.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.run == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: core-src
          persist-credentials: false
      - name: serve the reviewed revision from a local mirror
        if: steps.gate.outputs.run == 'true'
        run: |
          mirror=$(mktemp -d "$RUNNER_TEMP/core-source.XXXXXX")
          git clone -q --bare core-src "$mirror"
          rm -rf core-src
          {
            echo 'GIT_CONFIG_COUNT=1'
            echo "GIT_CONFIG_KEY_0=url.file://$mirror.insteadOf"
            echo 'GIT_CONFIG_VALUE_0=https://github.com/TBI-AI-Incubator/codify.git'
          } >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: '3.12'
      - name: pin Platform at the reviewed revision and install
        if: steps.gate.outputs.run == 'true'
        env:
          REVIEW_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          current=$(python3 -I -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["tool"]["uv"]["sources"]["codify-core"]["rev"])')
          sed -i "s/$current/$REVIEW_SHA/" pyproject.toml
          uv lock
          uv sync --frozen
      - name: Platform's contract tests against this Core
        if: steps.gate.outputs.run == 'true'
        env:
          CODIFY_DATA_ROOT: ${{ github.workspace }}/data
        run: uv run --frozen pytest apps/api/tests/test_product_surface_manifest.py -q -p no:cacheprovider
