# Reviewed by hand; nothing auto-merges.
# cooldown: the least a release must have aged before its PR opens. Security updates are exempt.

version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: Europe/London
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python
    cooldown:
      default-days: 7
      semver-patch-days: 7
      semver-minor-days: 14
      semver-major-days: 30
    groups:
      patch-and-minor:
        update-types:
          - patch
          - minor
      major-updates:
        update-types:
          - major

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
      day: tuesday
      time: '08:00'
      timezone: Europe/London
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - javascript
    cooldown:
      default-days: 7
      semver-patch-days: 7
      semver-minor-days: 14
      semver-major-days: 30
    ignore:
      # typescript-eslint cannot load TS 7 yet; every TS major fails the lint step.
      - dependency-name: 'typescript'
        update-types:
          - version-update:semver-major
    groups:
      patch-and-minor:
        update-types:
          - patch
          - minor
      major-updates:
        update-types:
          - major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: wednesday
      time: '08:00'
      timezone: Europe/London
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - '*'
